stages:
  - build
  - upload
  - release

variables:
  PACKAGE_VERSION: "$CI_COMMIT_TAG"
  CHECKMK_PLUGIN: "unifi"
  CHECKMK_PLUGIN_FILENAME: "${CHECKMK_PLUGIN}-${PACKAGE_VERSION}.mkp"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CHECKMK_PLUGIN}/${PACKAGE_VERSION}"

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - sed -i "s/0.0.1/${PACKAGE_VERSION}/g"  src/baseinfo.ini
    - make
  artifacts:
    paths:
      - build/*.mkp

upload:
  stage: upload
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build/${CHECKMK_PLUGIN_FILENAME} "${PACKAGE_REGISTRY_URL}/${CHECKMK_PLUGIN_FILENAME}"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      release-cli create --name "Release $CI_COMMIT_TAG" --tag-name $CI_COMMIT_TAG \
        --assets-link "{\"name\":\"${CHECKMK_PLUGIN_FILENAME}\",\"url\":\"${PACKAGE_REGISTRY_URL}/${CHECKMK_PLUGIN_FILENAME}\"}"
